name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # An x86_64 runner executes i386 natively; the containers only supply Debian 8's gcc 4.9
          # and glibc.
          - { name: i386, runner: ubuntu-24.04, platform: linux/386 }
          - { name: amd64, runner: ubuntu-24.04, platform: linux/amd64 }
          - { name: amd64 (clock_gettime), runner: ubuntu-24.04, platform: linux/amd64, cppflags: -DUSE_CLOCK_GETTIME }
          - { name: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64 }
    steps:
      - uses: actions/checkout@v4
      - name: SFSlite, libbyz (BFT and BASE), bft-simple, simple
        run: >-
          docker run --rm --platform ${{ matrix.platform }} -e EXTRA_CPPFLAGS='${{ matrix.cppflags }}'
          -v "$PWD:/src:ro" debian/eol:jessie bash /src/ci/build.sh /src
